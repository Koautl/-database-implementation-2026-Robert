<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Hair Fix Salon</title>
  <link rel="stylesheet" href="assets/styles.css"><script src="assets/config.js" defer></script><script src="assets/mock-data.js" defer></script><script src="assets/api-client.js" defer></script><script src="assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">HF</span><span>Hair Fix Salon</span></a><a class="text-link" href="index.html">Back to site</a></div></header>
  <main id="main" class="login-shell">
    <section class="login-art"><p class="eyebrow">Hair Fix Portal</p><h1>Welcome back.</h1><p>This page demonstrates role-based navigation without authentication or a database.</p></section>
    <section class="login-form-wrap"><div class="login-card"><p class="eyebrow">Prototype sign in</p><h2 style="font-size:2rem">Choose a portal</h2><div class="notice" style="margin-bottom:1.25rem">Any email and password will work. Nothing is stored.</div><form data-login-form>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="demo@hairfix.example" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" value="prototype" required></div>
      <div class="field"><label for="role">Demo role</label><select id="role" name="role"><option value="customer">Customer</option><option value="staff">Staff</option><option value="admin">Administrator</option></select></div>
      <button class="button" type="submit">Open demo portal</button>
    </form></div></section>
  </main>
</body>
</html>
